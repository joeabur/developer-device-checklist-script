name: ShellCheck

on:
  push:
    paths:
      - '**/*.sh'
      - '.github/workflows/**'
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run ShellCheck on script (ignore nvm/source and ls/xargs warnings)
        run: shellcheck -e SC1091,SC2012,SC2038 -x ./dev-security-check.sh || true
