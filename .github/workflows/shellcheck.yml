name: ShellCheck

on:
  push:
    paths:
      - '**/*.sh'
      - '.github/workflows/**'
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run ShellCheck on script
        run: shellcheck -x ./dev-security-check.sh
