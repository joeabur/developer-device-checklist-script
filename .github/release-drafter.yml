name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🚀 Features'
    labels:
      - enhancement
  - title: '🐛 Bug Fixes'
    labels:
      - bug
  - title: '🧰 Maintenance'
    labels:
      - chore
change-template: '- $TITLE #$NUMBER (@$AUTHOR)'
template: |
  ## What's Changed

  $CHANGES

  Full changelog: https://github.com/joeabur/developer-device-checklist-script/compare/$FROM...$TO
